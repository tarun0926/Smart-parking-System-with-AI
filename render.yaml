# render.yaml — Infrastructure-as-Code for Render.com
# Deploy both backend and AI service in one click.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Node.js / Express Backend ────────────────────────────────────────────
  - type: web
    name: smartpark-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # Fill in Render dashboard — MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRE
        value: 30d
      - key: AI_SERVICE_URL
        fromService:
          name: smartpark-ai-service
          type: web
          property: host
          envVarKey: AI_SERVICE_URL
      - key: CLIENT_ORIGIN
        sync: false          # Fill in your Vercel frontend URL after deploying

  # ── Python / FastAPI AI Service ──────────────────────────────────────────
  - type: web
    name: smartpark-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false          # Fill in your Render backend URL after deploying

